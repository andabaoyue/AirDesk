name: Build & Release AirDesk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop Host (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: airdesk-desktop-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: airdesk-desktop-host/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Windows Installer (runs prebuild:win automatically)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
      - name: Build macOS DMG (runs prebuild:mac automatically)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: airdesk-host-${{ matrix.os }}
          path: |
            airdesk-desktop-host/dist/*.exe
            airdesk-desktop-host/dist/*.dmg
            airdesk-desktop-host/dist/*.zip
            airdesk-desktop-host/dist/*.blockmap
            airdesk-desktop-host/dist/latest*.yml
          if-no-files-found: warn

  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airdesk-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode Release Keystore (if configured in Secrets)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AIRDESK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airdesk-release.jks"
            echo "AIRDESK_KEYSTORE_PATH=$RUNNER_TEMP/airdesk-release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::AIRDESK_KEYSTORE_BASE64 secret not set; falling back to debug signing."
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build arm64-v8a Release APK
        env:
          AIRDESK_KEYSTORE_PASSWORD: ${{ secrets.AIRDESK_KEYSTORE_PASSWORD }}
          AIRDESK_KEY_ALIAS: ${{ secrets.AIRDESK_KEY_ALIAS }}
          AIRDESK_KEY_PASSWORD: ${{ secrets.AIRDESK_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Stage Named APK Artifact
        shell: bash
        run: |
          mkdir -p dist-apk
          TAG_NAME="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist-apk/airdesk-${TAG_NAME}-arm64-v8a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: airdesk-android-apk
          path: airdesk-android/dist-apk/*.apk

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
